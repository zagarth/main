# Admin Directory Security Configuration
# Add this to your Apache virtual host configuration

<Directory "/var/www/html/homesite/admin">
    # Force HTTPS for admin directory
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    
    # Enhanced security headers for admin area
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://api.qrserver.com; img-src 'self' data: https://api.qrserver.com; font-src 'self'; connect-src 'self'; frame-ancestors 'none';"
    
    # Remove server information
    Header always unset Server
    Header always unset X-Powered-By
    
    # Cache control for admin files
    Header always set Cache-Control "no-cache, no-store, must-revalidate, private"
    Header always set Pragma "no-cache"
    Header always set Expires "0"
    
    # IP-based access control (uncomment and configure as needed)
    # Require ip 192.168.1.0/24
    # Require ip 127.0.0.1
    
    # File type restrictions
    <FilesMatch "\.(txt|log|md|json)$">
        Require all denied
    </FilesMatch>
    
    # Protect sensitive files
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    
    # PHP security settings
    php_admin_value expose_php Off
    php_admin_value display_errors Off
    php_admin_value log_errors On
    php_admin_value session.cookie_httponly On
    php_admin_value session.cookie_secure On
    php_admin_value session.use_only_cookies On
    php_admin_value session.cookie_samesite Strict
</Directory>

# Protect admin configuration files
<Files ".env">
    Require all denied
</Files>

<Files "*.json">
    <RequireAll>
        Require expr %{REQUEST_URI} !~ m#/admin/#
    </RequireAll>
</Files>

# Additional SSL/TLS configuration for admin security
SSLEngine on
SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
SSLCipherSuite ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256
SSLHonorCipherOrder on
SSLCompression off
SSLUseStapling on
SSLStaplingResponderTimeout 5
SSLStaplingReturnResponderErrors off