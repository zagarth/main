# Admin Directory SSL Configuration
# Adds additional security headers and forces HTTPS for admin area

<Directory "/var/www/html/homesite/admin">
    # Force HTTPS for admin directory
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    
    # Additional Security Headers for Admin Area
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';"
    
    # Disable server signature in admin area
    ServerSignature Off
    
    # Enhanced session security
    php_value session.cookie_secure 1
    php_value session.cookie_httponly 1
    php_value session.cookie_samesite Strict
    php_value session.gc_maxlifetime 3600
    
    # Prevent access to sensitive files
    <FilesMatch "\.(env|log|md|txt|json)$">
        Require all denied
    </FilesMatch>
    
    # Enhanced logging for admin area
    LogLevel warn
    CustomLog ${APACHE_LOG_DIR}/admin_access.log combined
    ErrorLog ${APACHE_LOG_DIR}/admin_error.log
</Directory>