<!DOCTYPE html>
<html>
<head>
    <title>Debug Lady's Stoneset Modal</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Debug Lady's Stoneset ProductModal</h1>
    <button onclick="testProductModal()">Test ProductModal with 1898</button>
    <div id="result"></div>

    <script>
    async function testProductModal() {
        console.log('Testing ProductModal request for product 1898');
        document.getElementById('result').innerHTML = 'Testing...';
        
        try {
            const productId = '1898';
            console.log('Making request for product ID:', productId);
            
            const response = await fetch('get_product_modal_data.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `product_id=${encodeURIComponent(productId)}`
            });
            
            console.log('Response status:', response.status);
            console.log('Response headers:', response.headers);
            
            const text = await response.text();
            console.log('Raw response text:', text);
            
            let data;
            try {
                data = JSON.parse(text);
            } catch (e) {
                console.error('Failed to parse JSON:', e);
                document.getElementById('result').innerHTML = '<pre>JSON Parse Error: ' + e.message + '\nRaw response: ' + text + '</pre>';
                return;
            }
            
            console.log('Parsed JSON:', data);
            
            if (data.success) {
                document.getElementById('result').innerHTML = '<pre style="color: green;">SUCCESS!\nProduct: ' + JSON.stringify(data.product, null, 2) + '</pre>';
            } else {
                document.getElementById('result').innerHTML = '<pre style="color: red;">FAILED!\nError: ' + (data.error || 'Unknown error') + '</pre>';
            }
            
        } catch (error) {
            console.error('Request failed:', error);
            document.getElementById('result').innerHTML = '<pre style="color: red;">Request Error: ' + error.message + '</pre>';
        }
    }
    </script>
</body>
</html>
